<!doctype html>
<html lang="en" class="wa-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0c11" />
    <title>xkeeper console</title>
    <script>
      // Theme pre-paint (inline: module scripts run too late and a light-OS
      // user would flash dark). Mirrors src/theme.ts — `wa-dark` on <html> is
      // the single switch; the mode persists under 'xkeeper:theme'.
      ;(() => {
        let mode = 'system'
        try {
          mode = localStorage.getItem('xkeeper:theme') || 'system'
        } catch {}
        const light =
          mode === 'light' ||
          (mode === 'system' &&
            typeof matchMedia === 'function' &&
            matchMedia('(prefers-color-scheme: light)').matches)
        document.documentElement.classList.toggle('wa-dark', !light)
      })()
    </script>
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/app.css" />
  </head>
  <body>
    <xkeeper-app></xkeeper-app>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
