---
# 只读预检：对目标机做任何变更之前执行。
#   - 命中既有安装痕迹且未强制覆盖 → fail fast（目标机零变更）
#   - 命中且为本 role 部署的相同内容（checksum 一致 + 服务 running/enabled）
#     → 幂等命中，置 xk_idempotent_hit 由入口 end_host 跳过
# systemctl 探测均 failed_when: false + changed_when: false，只读取输出。

- name: Detect existing systemd unit file
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ xkeeper_service_name }}.service"
  register: xk_unit_pre

- name: Detect service active state
  ansible.builtin.command: "systemctl is-active {{ xkeeper_service_name }}"
  register: xk_active_pre
  failed_when: false
  changed_when: false
  # 只读命令，check 模式下也真实执行，保证护栏在 dry-run 中可用
  check_mode: false

- name: Detect service enabled state
  ansible.builtin.command: "systemctl is-enabled {{ xkeeper_service_name }}"
  register: xk_enabled_pre
  failed_when: false
  changed_when: false
  check_mode: false

- name: Detect existing binary (with checksum)
  ansible.builtin.stat:
    path: "{{ xkeeper_binary_dest }}"
    get_checksum: true
  register: xk_binary_pre

- name: Detect existing core config (with checksum)
  ansible.builtin.stat:
    path: "{{ xkeeper_config_dest }}"
    get_checksum: true
  register: xk_config_pre

- name: Collect detected traces of an existing installation
  ansible.builtin.set_fact:
    xk_traces: >-
      {{ []
         + (['systemd unit file exists: /etc/systemd/system/' ~ xkeeper_service_name ~ '.service'] if xk_unit_pre.stat.exists else [])
         + (['service is ' ~ xk_active_pre.stdout] if xk_active_pre.rc == 0 else [])
         + (['service is enabled'] if xk_enabled_pre.rc == 0 else [])
         + (['binary exists at ' ~ xkeeper_binary_dest] if xk_binary_pre.stat.exists else [])
         + (['core config exists at ' ~ xkeeper_config_dest] if xk_config_pre.stat.exists else []) }}

- name: Determine idempotent hit (own deployment, identical content)
  ansible.builtin.set_fact:
    xk_idempotent_hit: >-
      {{ xk_unit_pre.stat.exists
         and xk_active_pre.rc == 0
         and xk_enabled_pre.rc == 0
         and xk_binary_pre.stat.exists
         and xk_config_pre.stat.exists
         and xk_binary_pre.stat.checksum | default('') == xk_src_binary.stat.checksum
         and xk_config_pre.stat.checksum | default('') == xk_src_config.stat.checksum }}

- name: Report idempotent hit (no changes will be made)
  ansible.builtin.debug:
    msg: >-
      检测到本机已由相同内容部署（二进制与配置 checksum 一致，服务运行中且已开机自启），
      幂等跳过，服务不会重启。
  when: xk_idempotent_hit | bool

- name: Fail fast on existing installation without force override
  ansible.builtin.fail:
    msg: >-
      检测到目标机已存在 xkeeper 安装，为避免误触生产环境，本次执行已停止，
      目标机未做任何修改。检测到的痕迹：{{ xk_traces | join('; ') }}。
      如确认要覆盖并重启既有安装，请在 extra-vars 中显式设置
      xkeeper_force_overwrite: true 后重试。
  when:
    - xk_traces | length > 0
    - not xk_idempotent_hit | bool
    - not xkeeper_force_overwrite | bool

- name: Report force-overwrite path
  ansible.builtin.debug:
    msg: >-
      xkeeper_force_overwrite=true：检测到既有安装（{{ xk_traces | join('; ') }}），
      将覆盖二进制与配置并按需重启服务。
  when:
    - xk_traces | length > 0
    - xkeeper_force_overwrite | bool
