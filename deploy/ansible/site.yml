---
# xkeeper Ansible 部署 playbook
#
# 流程：只读预检（既有安装护栏）→ 分发二进制与核心配置 → xkeeper service install --now
#
# 安全护栏（默认开启）：
#   目标机上若已存在 xkeeper（unit 文件 / 运行中服务 / 二进制 / 核心配置任一痕迹），
#   playbook 立即失败且不做任何修改，避免误触生产环境。
#   仅当显式设置 xkeeper_force_overwrite: true 时才允许覆盖既有安装（含重启）。
#   由本 playbook 部署且内容完全一致的安装重跑视为幂等命中，直接跳过不重启。
#
# 必填变量：
#   xkeeper_binary_src  控制机上的 xkeeper 二进制路径，或 http(s):// 下载 URL
#   xkeeper_config_src  控制机上的核心配置文件路径（复制到目标机 /etc/xkeeper.toml）
# 其余变量见 deploy/ansible/README.md。

- name: Deploy xkeeper
  hosts: all
  become: true
  any_errors_fatal: true
  gather_facts: false

  vars:
    xkeeper_binary_dest: /usr/local/bin/xkeeper
    xkeeper_config_dest: /etc/xkeeper.toml
    xkeeper_service_name: xkeeper
    xkeeper_service_user: ""
    xkeeper_force_overwrite: false
    xkeeper_binary_checksum: ""
    # 控制机侧暂存目录（URL 来源时下载至此再分发）
    xkeeper_staging_dir: "{{ playbook_dir }}/.tmp"

  pre_tasks:
    - name: Assert required variables are set
      ansible.builtin.assert:
        that:
          - xkeeper_binary_src is defined and xkeeper_binary_src | length > 0
          - xkeeper_config_src is defined and xkeeper_config_src | length > 0
        fail_msg: >-
          必填变量缺失：xkeeper_binary_src（二进制路径或 URL）与
          xkeeper_config_src（核心配置文件路径）必须由 inventory 或 extra-vars 提供。

    - name: Classify binary source (URL or local path)
      ansible.builtin.set_fact:
        xk_binary_is_url: "{{ xkeeper_binary_src is string and xkeeper_binary_src | lower is match('https?://') }}"

    # ---- 控制机侧：解析源文件与 checksum（不触碰目标机） ----
    - name: Prepare controller staging directory
      ansible.builtin.file:
        path: "{{ xkeeper_staging_dir }}"
        state: directory
        mode: "0755"
      when: xk_binary_is_url | bool
      delegate_to: localhost
      become: false

    - name: Stage binary from URL on controller
      ansible.builtin.get_url:
        url: "{{ xkeeper_binary_src }}"
        dest: "{{ xkeeper_staging_dir }}/xkeeper-staged-{{ inventory_hostname }}"
        mode: "0755"
        checksum: "{{ ('sha256:' ~ xkeeper_binary_checksum) if xkeeper_binary_checksum | length > 0 else omit }}"
      register: xk_stage_binary
      when: xk_binary_is_url | bool
      delegate_to: localhost
      become: false

    - name: Resolve effective binary source path
      ansible.builtin.set_fact:
        xk_binary_effective_src: "{{ xk_stage_binary.dest if xk_binary_is_url | bool else xkeeper_binary_src }}"

    - name: Stat binary source on controller
      ansible.builtin.stat:
        path: "{{ xk_binary_effective_src }}"
        get_checksum: true
      register: xk_src_binary
      delegate_to: localhost
      become: false
      failed_when: not xk_src_binary.stat.exists

    - name: Stat config source on controller
      ansible.builtin.stat:
        path: "{{ xkeeper_config_src }}"
        get_checksum: true
      register: xk_src_config
      delegate_to: localhost
      become: false
      failed_when: not xk_src_config.stat.exists

    # ---- 目标机侧：只读预检，任何变更发生之前 ----
    - name: Detect existing systemd unit file
      ansible.builtin.stat:
        path: "/etc/systemd/system/{{ xkeeper_service_name }}.service"
      register: xk_unit_pre

    - name: Detect service active state
      ansible.builtin.command: "systemctl is-active {{ xkeeper_service_name }}"
      register: xk_active_pre
      failed_when: false
      changed_when: false

    - name: Detect service enabled state
      ansible.builtin.command: "systemctl is-enabled {{ xkeeper_service_name }}"
      register: xk_enabled_pre
      failed_when: false
      changed_when: false

    - name: Detect existing binary (with checksum)
      ansible.builtin.stat:
        path: "{{ xkeeper_binary_dest }}"
        get_checksum: true
      register: xk_binary_pre

    - name: Detect existing core config (with checksum)
      ansible.builtin.stat:
        path: "{{ xkeeper_config_dest }}"
        get_checksum: true
      register: xk_config_pre

    - name: Collect detected traces of an existing installation
      ansible.builtin.set_fact:
        xk_traces: >-
          {{ []
             + (['systemd unit file exists: /etc/systemd/system/' ~ xkeeper_service_name ~ '.service'] if xk_unit_pre.stat.exists else [])
             + (['service is ' ~ xk_active_pre.stdout] if xk_active_pre.rc == 0 else [])
             + (['service is enabled'] if xk_enabled_pre.rc == 0 else [])
             + (['binary exists at ' ~ xkeeper_binary_dest] if xk_binary_pre.stat.exists else [])
             + (['core config exists at ' ~ xkeeper_config_dest] if xk_config_pre.stat.exists else []) }}

    - name: Determine idempotent hit (own deployment, identical content)
      ansible.builtin.set_fact:
        xk_idempotent_hit: >-
          {{ xk_unit_pre.stat.exists
             and xk_active_pre.rc == 0
             and xk_enabled_pre.rc == 0
             and xk_binary_pre.stat.exists
             and xk_config_pre.stat.exists
             and xk_binary_pre.stat.checksum | default('') == xk_src_binary.stat.checksum
             and xk_config_pre.stat.checksum | default('') == xk_src_config.stat.checksum }}

    - name: Report idempotent hit (no changes will be made)
      ansible.builtin.debug:
        msg: >-
          检测到本机已由相同内容部署（二进制与配置 checksum 一致，服务运行中且已开机自启），
          幂等跳过，服务不会重启。
      when: xk_idempotent_hit | bool

    - name: Skip host on idempotent hit
      ansible.builtin.meta: end_host
      when: xk_idempotent_hit | bool

    - name: Fail fast on existing installation without force override
      ansible.builtin.fail:
        msg: >-
          检测到目标机已存在 xkeeper 安装，为避免误触生产环境，本次执行已停止，
          目标机未做任何修改。检测到的痕迹：{{ xk_traces | join('; ') }}。
          如确认要覆盖并重启既有安装，请在 inventory 或 extra-vars 中显式设置
          xkeeper_force_overwrite: true 后重试。
      when:
        - xk_traces | length > 0
        - not xk_idempotent_hit | bool
        - not xkeeper_force_overwrite | bool

    - name: Report force-overwrite path
      ansible.builtin.debug:
        msg: >-
          xkeeper_force_overwrite=true：检测到既有安装（{{ xk_traces | join('; ') }}），
          将覆盖二进制与配置并按需重启服务。
      when:
        - xk_traces | length > 0
        - xkeeper_force_overwrite | bool

  tasks:
    - name: Ensure destination directories exist
      ansible.builtin.file:
        path: "{{ item | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ xkeeper_binary_dest }}"
        - "{{ xkeeper_config_dest }}"

    # ---- 分发二进制 ----
    - name: Distribute xkeeper binary
      ansible.builtin.copy:
        src: "{{ xk_binary_effective_src }}"
        dest: "{{ xkeeper_binary_dest }}"
        owner: root
        group: root
        mode: "0755"
      notify: Restart xkeeper service

    # ---- 安装核心配置 ----
    - name: Install core config
      ansible.builtin.copy:
        src: "{{ xkeeper_config_src }}"
        dest: "{{ xkeeper_config_dest }}"
        owner: root
        group: root
        mode: "0644"
      notify: Restart xkeeper service

    # ---- 注册并启动 systemd 服务 ----
    - name: Build service install argument list
      ansible.builtin.set_fact:
        xk_service_install_argv: >-
          {{ [xkeeper_binary_dest, 'service', 'install', '--now', '--name', xkeeper_service_name]
             + (['--force'] if (xkeeper_force_overwrite | bool and xk_traces | length > 0) else [])
             + (['--user', xkeeper_service_user] if xkeeper_service_user | length > 0 else []) }}

    - name: Register and start xkeeper service
      ansible.builtin.command:
        argv: "{{ xk_service_install_argv }}"
      changed_when: not xk_unit_pre.stat.exists

    - name: Verify service is running and enabled
      ansible.builtin.command: "systemctl is-active {{ xkeeper_service_name }}"
      register: xk_active_post
      changed_when: false
      failed_when: xk_active_post.rc != 0

  post_tasks:
    - name: Clean up controller staging directory
      ansible.builtin.file:
        path: "{{ xkeeper_staging_dir }}"
        state: absent
      when: xk_binary_is_url | bool
      delegate_to: localhost
      become: false

  handlers:
    # 仅当部署前 unit 已存在（覆盖既有安装）且本轮文件发生变化时重启；
    # 全新部署由 service install --now 完成首次启动，不额外重启。
    - name: Restart xkeeper service
      ansible.builtin.systemd:
        name: "{{ xkeeper_service_name }}"
        state: restarted
        enabled: true
      when: xk_unit_pre.stat.exists
