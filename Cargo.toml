[package]
name = "xkeeper"
version = "0.1.0"
edition = "2024"
description = "A lightweight process keeper/daemon supervised from a TOML file"
license = "MIT"

[dependencies]
anyhow = "1.0"
arc-swap = "1.7"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
env_logger = "0.11"
flate2 = "1"
futures-util = "0.3"
log = "0.4"
rmp-serde = "1.3"
rust-embed = { version = "8.12.0", features = ["interpolate-folder-path"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["compression-gzip"] }
toml_edit = "0.22"
ureq = "2.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tokio-tungstenite = { version = "0.26", features = ["connect"] }
tower = { version = "0.5", features = ["util"] }
