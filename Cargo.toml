[workspace]
members = ["xtask"]
resolver = "2"

[package]
name = "xkeeper"
version = "0.1.0"
edition = "2024"
description = "A lightweight process keeper/daemon supervised from a TOML file"
license = "MIT"

[dependencies]
anyhow = "1.0"
arc-swap = "1.7"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
rustyline = "18"
env_logger = { version = "0.11", default-features = false, features = ["auto-color"] }
flate2 = "1"
futures-util = "0.3"
log = "0.4"
rmp-serde = "1.3"
rust-embed = { version = "8.12.0", features = ["interpolate-folder-path"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
toml = "1.1"
toml_edit = "0.25"
tower-http = { version = "0.7", features = ["compression-gzip"] }
# 控制面/健康探测均为本地 http，无需 TLS（砍掉 rustls + ring）
ureq = { version = "2.10", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# 高性能 + 小体积：O3 + 全量 LTO + 单 codegen unit
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = "symbols"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
tokio-tungstenite = { version = "0.26", features = ["connect"] }
tower = { version = "0.5", features = ["util"] }
