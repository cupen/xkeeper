[package]
name = "xkeeper-bench"
version = "0.1.0"
edition = "2024"
publish = false
description = "Load benchmark harness for a real xkeeper daemon: case-driven load generation, external metric collection and machine-readable reports"

[dependencies]
anyhow = "1.0"
# 控制面为本地 http，无需 TLS（与根包同款配置）
ureq = { version = "2.10", default-features = false }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# connect 模式从 /v1/status 的 config_source 读回 daemon.toml 解析 app_dir/log_dir
toml = "1.1"
# 退出路径（含 ctrl-C）统一清理
ctrlc = "3.4"
