# App config sample — lives INSIDE the app's deployment directory as
# xkeeper.toml. Register it from that directory with:  xkeeper add . --name demo
# Program-explicit fields override [app], which overrides daemon [app-default].

[app]
description = "Demo app kept alive by xkeeper"
autostart = true            # start with the daemon
autorestart = "always"      # always | on-failure | never
# priority = 0              # smaller starts first
# restart_backoff = 1.0
# stop_timeout = 10

[program.ping]              # map interface: the key IS the program name
command = "ping -n 3600 127.0.0.1"   # single-line form; or command + args (mutually exclusive)
# args = ["-n", "3600", "127.0.0.1"]
# work_dir = "."
# env = { FOO = "bar" }
# startsecs = 1.0           # must run this long to count as started
# startretries = 3          # failed-start budget, exhausted -> fatal
# depends_on = []           # program names; can cross apps
# exit_codes = [0]          # "expected" codes for on-failure
# log_max_size = "50MB"     # rotate when the log grows past this; "0" disables rotation
# log_rotate_keep = 2       # rotated files to keep (3 files on disk per stream)
# health_check = "http://127.0.0.1:8000/health"   # http(s):// | tcp://host:port | exec command line
# health_interval = 10
# health_timeout = 2
# health_retries = 3
# health_start_period = 5
