# ============================================================
# xkeeper 示例配置
#   校验:  cargo run -- validate -c config.toml
#   运行:  cargo run -- run -c config.toml
# ============================================================

[daemon]
# 日志级别: trace / debug / info / warn / error
log_level = "info"
# 各程序 stdout/stderr 日志的存放目录（相对路径基于本配置文件所在目录）
log_dir = "logs"
# 巡检间隔（秒），决定退出检测与重启的粒度
monitor_interval = 1.0

# 一个无害的演示程序：持续 ping，被结束或崩溃后自动重启
[[program]]
name = "demo-ping"
command = "ping"
args = ["-n", "3600", "127.0.0.1"]
# Linux/macOS 上可改为: command = "sleep", args = ["3600"]
# 也可以指定:
# working_dir = "."
# environment = { FOO = "bar" }

# 退出后自动重启（默认 true）
autorestart = true
# 首次重启延迟（秒），之后按 2 的幂指数退避
restart_backoff = 1.0
# 退避上限（秒）
max_restart_backoff = 30.0
# 连续重启超过该次数后进入 fatal 状态不再重启；0 表示不限制
# max_restarts = 0
# 优雅停止的等待秒数，超时强杀（仅 Unix 有意义）
# stop_timeout = 10
# 进程连续运行超过该秒数后，重启计数与退避清零
# backoff_reset_after = 60

# 可以声明任意多个 [[program]]
# [[program]]
# name = "another-service"
# command = "python"
# args = ["-m", "http.server", "8000"]
